<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventor desktop</title>
    <meta name="description" content="Download Inventor for Mac" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg width='1024' height='1024' viewBox='0 0 1024 1024' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M204 176v560.116l.772 6.207c10.054 76.329 70.916 136.316 147.434 145.218L356.155 888h95.416V772.909h109.694V658.166h110.03V543.418h109.354V428.674L890 428.676V325.96C890 243.139 822.887 176 740.098 176H204zm536.098 68.627c44.902 0 81.302 36.414 81.302 81.333v34.09h-109.353v114.746H602.693v114.746H492.663v114.745H382.97v114.746H360.13c-45.333-5.274-81.403-40.9-87.346-86.016L272.6 731.872V244.627h467.498z' fill='%23262626' fill-rule='nonzero'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page-base: #ffffff;
        --foreground: #171717;
        --muted: #737373;
        --border: #e5e5e5;
        --fill: #f5f5f5;
        --u: 8px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page-base);
        color: var(--foreground);
        font-family: Geist, sans-serif;
        font-size: 12px;
        line-height: 16px;
        font-weight: 400;
      }
      body {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      body:hover {
        scrollbar-color: #d4d4d4 transparent;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: calc(var(--u) * 6) calc(var(--u) * 2) calc(var(--u) * 8);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
      }
      h1 {
        margin: 0;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--u);
      }
      .primary {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--foreground);
        border-radius: 6px;
        background: var(--foreground);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        width: fit-content;
      }
      .primary[aria-disabled="true"] {
        pointer-events: none;
        opacity: 0.4;
      }
      .ghost {
        color: var(--muted);
        text-decoration: none;
      }
      .ghost:hover {
        color: var(--foreground);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: var(--u);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .list li {
        display: flex;
        justify-content: space-between;
        gap: var(--u);
        padding: var(--u) 0;
        border-top: 1px solid var(--border);
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
      }
      .caps {
        font-weight: 600;
        font-size: 10.2px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Inventor</h1>
      <p>Mac download for the inspect companion</p>
      <div class="row">
        <a class="primary" id="latest" aria-disabled="true" href="#">Download for Mac</a>
        <span class="mono" id="latest-meta"></span>
      </div>
      <p id="status">Loading releases</p>
      <p>macOS may ask you to open the app the first time</p>
      <p class="caps" id="past-label" hidden>Earlier</p>
      <ul class="list" id="past" hidden></ul>
    </main>
    <script>
      const REPO = "yayeandriy/inventor-desktop";

      function humanDate(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "";
        return d.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function countLabel(n, one, many) {
        return n === 1 ? `1 ${one}` : `${n} ${many}`;
      }

      function dmgAsset(release) {
        return (release.assets || []).find((a) => /\.dmg$/i.test(a.name));
      }

      function versionOf(release) {
        return (release.tag_name || release.name || "").replace(/^v/i, "");
      }

      async function main() {
        const status = document.getElementById("status");
        const latestBtn = document.getElementById("latest");
        const latestMeta = document.getElementById("latest-meta");
        const past = document.getElementById("past");
        const pastLabel = document.getElementById("past-label");
        try {
          const res = await fetch(
            `https://api.github.com/repos/${REPO}/releases?per_page=20`,
          );
          if (!res.ok) throw new Error("releases");
          const releases = (await res.json()).filter((r) => !r.draft);
          const withDmg = releases
            .map((r) => ({ release: r, dmg: dmgAsset(r) }))
            .filter((x) => x.dmg);
          if (withDmg.length === 0) {
            status.textContent = "No Mac build published yet";
            return;
          }
          const first = withDmg[0];
          latestBtn.href = first.dmg.browser_download_url;
          latestBtn.removeAttribute("aria-disabled");
          latestBtn.textContent = `Download ${versionOf(first.release)}`;
          latestMeta.textContent = humanDate(first.release.published_at);
          status.textContent = countLabel(withDmg.length, "release", "releases");
          const rest = withDmg.slice(1);
          if (rest.length === 0) return;
          past.hidden = false;
          pastLabel.hidden = false;
          for (const { release, dmg } of rest) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.className = "ghost";
            a.href = dmg.browser_download_url;
            a.textContent = versionOf(release);
            const when = document.createElement("span");
            when.className = "mono";
            when.textContent = humanDate(release.published_at);
            li.append(a, when);
            past.append(li);
          }
        } catch (e) {
          status.textContent = "Could not load releases";
        }
      }

      main();
    </script>
  </body>
</html>
